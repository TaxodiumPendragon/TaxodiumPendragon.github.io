title: TaxodiumPendragon
email: ""
description: >-
  课程笔记与论文阅读笔记：体系结构、数据流加速器及相关方向。
baseurl: ""
url: "https://taxodiumpendragon.github.io"
github_username: TaxodiumPendragon
lang: zh-CN

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# 导航：板块入口页
header_pages:
  - courses.md
  - papers.md
  - about.markdown

# 两大板块用 Collections 区分；板块内再用 course / tags 细分
# 参考 al-folio / Academic Pages 的 collection 写法
collections:
  papers:
    output: true
    permalink: /papers/:name/
  courses:
    output: true
    permalink: /courses/:name/

defaults:
  - scope:
      path: ""
      type: "papers"
    values:
      layout: note
      section: papers
  - scope:
      path: ""
      type: "courses"
    values:
      layout: note
      section: courses

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - scripts/
